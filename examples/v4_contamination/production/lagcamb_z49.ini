# VoidSim V4 linear transfer table at the IC epoch.
# run_parent.sh places this file beside an unmodified CAMB Planck-2018 base ini.
DEFAULT(planck_2018_base.ini)

# Transfer-only calculation.  The transfer columns are raw CAMB Delta/k^2;
# monofonIC and GenetIC apply A_s themselves.
output_root =
get_scalar_cls = F
get_vector_cls = F
get_tensor_cls = F
get_transfer = T
do_lensing = F
do_nonlinear = 0

# Planck2018EE+BAO+SN parameters used by monofonIC and the paper.
hubble = 67.742
ombh2 = 0.0224359998777366
omch2 = 0.119131301920623
omnuh2 = 0.0006451439
omk = 0
helium_fraction = 0.245421
massless_neutrinos = 2.046
nu_mass_eigenstates = 1
massive_neutrinos = 1
nu_mass_fractions = 1
share_delta_neff = T

initial_power_num = 1
pivot_scalar = 0.05
scalar_amp = 2.1064e-9
scalar_spectral_index = 0.96822
scalar_nrun = 0
scalar_nrunrun = 0

# k is in h/Mpc.  kmax=100 safely covers the planned effective 4096^3 zoom
# (Nyquist ~25 h/Mpc in a 512 Mpc/h box).
transfer_high_precision = T
transfer_kmax = 100
transfer_k_per_logint = 10
transfer_num_redshifts = 1
transfer_interp_matterpower = F
transfer_redshift(1) = 49
transfer_filename(1) = lagcamb_transfer_z49_raw.dat
transfer_matterpower(1) = matterpower_z49.dat
transfer_power_var = 7

# Suppress files that are irrelevant to the IC hand-off.
scalar_output_file =
vector_output_file =
tensor_output_file =
total_output_file =
lensed_output_file =
lensed_total_output_file =
lens_potential_output_file =
FITS_filename =
