################################################################################
# VoidSim V4 level-9 parent white-noise realization.
# The GRAFIC output is a cross-check; GenetIC imports the dumped bare WN and
# writes the parent IC used by lagRamses.
################################################################################
[setup]
GridRes              = 512
BoxLength            = 512
zstart               = 49
LPTorder             = 2
DoBaryons            = no
DoBaryonVrel         = no
DoFixing             = no
DoInversion          = no
DoRemoveCornerModes  = no
ParticleLoad         = sc
UseKSectionParticles = yes

DumpWhiteNoise    = yes
WhiteNoiseFile    = wn.h5
WhiteNoiseDataset = WhiteNoise

[cosmology]
ParameterSet    = Planck2018EE+BAO+SN
ZeroRadiation   = true
ztarget         = 49
transfer        = CAMB_file
transfer_file   = camb_transfer_z49.dat

[random]
generator = NGENIC
seed      = 12345

[execution]
NumThreads = 4

[output]
format          = grafic2
filename        = monofonic_parent
grafic_use_SPT  = no
