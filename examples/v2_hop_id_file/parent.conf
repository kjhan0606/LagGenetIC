################################################################################
# V2 evolved DMO parent: 64^3 white noise for the HOP-to-id_file integration.
################################################################################

[setup]
GridRes              = 64
BoxLength            = 64
zstart               = 99.0
LPTorder             = 1
DoBaryons            = no
DoBaryonVrel         = no
DoFixing             = no
DoInversion          = no
DoRemoveCornerModes  = no
ParticleLoad         = sc
UseKSectionParticles = yes
DumpWhiteNoise       = yes
WhiteNoiseFile       = wn.h5
WhiteNoiseDataset    = WhiteNoise

[cosmology]
ParameterSet  = Planck2018EE+BAO+SN
ZeroRadiation = true
transfer      = eisenstein

[random]
generator = NGENIC
seed      = 12345

[execution]
NumThreads = 1

[output]
format     = gadget_hdf5
filename   = parent.hdf5
UseLongids = true
