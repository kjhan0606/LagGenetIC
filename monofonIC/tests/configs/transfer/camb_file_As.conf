#########################################################################################
# CAMB-file A_s normalization regression at z=0
#########################################################################################

[setup]
GridRes         = 16
BoxLength       = 50
zstart          = 0
LPTorder        = 1
DoBaryons       = yes
ParticleLoad    = sc

[cosmology]
ParameterSet    = Planck2018EE+BAO+SN
Omega_m         = 0.279
Omega_b         = 0.0462
Omega_L         = 0.721
H0              = 70.1
n_s             = 0.96
A_s             = 1.7894007672836557e-9
k_p             = 0.05
ztarget         = 0
transfer        = CAMB_file
transfer_file   = camb_transfer_kmax40_z0_post2015.dat

[random]
generator       = NGENIC
seed            = 12345

[execution]
NumThreads      = 1

[output]
format          = generic
filename        = test_transfer.hdf5
